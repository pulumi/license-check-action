name: 'BUSL Blocker'
description: 'Fail the build when a Go dependency carries a forbidden licence'
inputs:
  module-path:
    description: 'Path to the go module you want to test'
    required: true
  ignore-modules:
    description: 'Comma separated list of modules to ignore'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Install go-licenses
      shell: bash
      env:
        # renovate: datasource=go depName=github.com/pulumi/go-licenses/v2
        GO_LICENSES_VERSION: v2.0.0
        GOBIN: ${{ github.action_path }}/bin
      run: |
        set -euo pipefail
        # Pinned rather than @latest, which moved every consumer onto a new major
        # without review when v2 shipped and broke pulumi-service CI outright when
        # `latest` briefly stopped resolving (pulumi/pulumi-service#32691).
        #
        # Retried because the install still reaches the module proxy and the
        # checksum database on every run, and an outage in either fails a
        # consumer's PR for reasons that have nothing to do with their change.
        for attempt in 1 2 3; do
          if go install "github.com/pulumi/go-licenses/v2@${GO_LICENSES_VERSION}"; then
            exit 0
          fi
          if [[ ${attempt} -lt 3 ]]; then
            echo "go install failed (attempt ${attempt}/3), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          fi
        done
        echo "::error::could not install go-licenses ${GO_LICENSES_VERSION} after 3 attempts"
        exit 1

    - name: Add go-licenses to PATH
      shell: bash
      run: echo "${GITHUB_ACTION_PATH}/bin" >> "$GITHUB_PATH"

    - name: Check licences
      working-directory: ${{ inputs.module-path }}
      shell: bash
      # Bound through the environment rather than interpolated into the script,
      # so an input cannot inject shell.
      env:
        IGNORE_MODULES: ${{ inputs.ignore-modules }}
      run: |
        set -euo pipefail

        # The module under test is ignored because we often cannot detect our own
        # LICENSE: Go copies the repo-root licence into each package when pulling
        # a dependency, but not when running against a raw checkout.
        ignores=(--ignore "$(go list -m)")

        # The standard library is ignored to work around
        # https://github.com/google/go-licenses/issues/244. The awk converts
        # `go list std` (one per line) into the comma-separated form --ignore takes.
        ignores+=(--ignore "$(go list std | awk 'NR > 1 { printf(",") } { printf("%s",$0) } END { print "" }')")

        # Only passed when the caller gave one. An empty `--ignore` consumes the
        # following flag, and go-licenses then reads the argument after it as a
        # package path -- so this died on `malformed import path` for anyone who
        # left the input at its default.
        trimmed=$(tr -d ' \t\r\n' <<<"${IGNORE_MODULES}")
        if [[ -n ${trimmed} ]]; then
          ignores+=(--ignore "${trimmed}")
        fi

        go-licenses check ./... --include_tests "${ignores[@]}"
