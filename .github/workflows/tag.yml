name: Tag

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  tag-major:
    name: Move the major alias
    runs-on: ubuntu-latest
    # `edited` fires on drafts as well, and a draft's `tag_name` names a tag
    # that does not exist yet -- the version regex cannot catch that, because a
    # draft can carry a perfectly well-formed v1.2.3.
    if: github.event.release.draft == false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const move = require('./.github/scripts/move-major-alias.js')
            await move({github, context, core})
